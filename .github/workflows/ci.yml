name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Frontend (lint, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: Backend (tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Solo para generar el cliente de Prisma: no se conecta a ninguna base.
      DATABASE_URL: postgresql://just:just@localhost:5432/just
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test